[llm]
order = ["groq", "groq-small", "gemini"]   # providers in preference order. Limits are per model on Groq (200k tokens/day each)
gemini_model = "gemini-3.5-flash-lite" # each Gemini model has its own free quota; "-latest" aliases and 2.5-flash ran out fast
groq_model = "openai/gpt-oss-120b"
groq_small_model = "openai/gpt-oss-20b"   # own rate limits; faster; next fallback and first choice for simple commands
route_simple = true                    # simple one-tool commands (volume, open, play...) go to groq-small first
gemini_rpm = 5                         # client-side limit: free tier allows 5 requests/minute
groq_rpm = 25
groq_reasoning_effort = "low"          # gpt-oss models: short thinking, and none of it leaked into replies
tool_groups = true                     # send a small core tool set + the groups a message needs (false = all 38 tools every time)
max_steps = 8
failover_attempts = 2                  # tries per provider on 429/5xx before switching to the fallback
failover_cooldown = 300                # seconds to stay on the fallback before trying the primary again

[paths]
vault = "VexVault"
logs = "logs"

[safety]
extra_safe_folders = []                # more folders where file tools run without asking (green)
confirm_timeout = 30                   # seconds to answer a y/n confirmation; no answer = no
typed_timeout = 60                     # seconds to type CONFIRM for catastrophic commands

[ui]
hotkey = "ctrl+alt+v"                # global hotkey (Win32 RegisterHotKey): start listening, or stop speaking and listen
                                     # modifiers: ctrl, alt, shift, win; e.g. "ctrl+shift+f9"
caption_seconds = 8                  # how long the pill keeps showing the last caption once idle
visual = "orb"                       # orb = the marbled orb app in vex_ui/ ; pill = small built-in widget ; both
orb_dir = "vex_ui"
orb_mode = "dock"                    # dock (pill on a screen edge <-> orb in the middle) or overlay (orb floats at orb_position)
orb_edge = "right"                   # dock: right or left
orb_edge_y = 0.40                    # dock: pill height, fraction from the top
orb_center_y = 0.50                  # dock: where the orb lands, fraction from the top
orb_radius = 62.0                      # dock: orb size in px
orb_position = "bottom"              # overlay: bottom, bottom-right, bottom-left, center, top-right
orb_palette = "blue"                 # blue, default (grey), violet, emerald
orb_size = ""                        # e.g. "420x340"; blank = the orb's default
orb_autosleep = 20                   # seconds idle before the orb returns to the edge / fades away (0 = stays)
orb_port = 47474                     # Vex -> orb (UDP, localhost)
orb_click_port = 47475               # orb -> Vex: clicking the orb starts listening

[web]
weather_place = ""                   # default city for "what's the weather"; blank = Vex asks
units = "metric"                     # metric (C, km/h) or imperial (F, mph)
# Optional second search backup: put TAVILY_API_KEY in .env (free tier). Without it Vex falls back to Bing, then Wikipedia.

[memory]
curator = true                       # after a conversation, save durable facts from it (memory/curator.py); audit: logs/curator.jsonl
curator_idle_seconds = 120           # a conversation is over after this much quiet
curator_order = ["groq-small", "groq", "gemini"]   # cheap model first, so live replies keep their rate limit
curator_min_words = 6                # shorter conversations are skipped without an LLM call
curator_max_attempts = 6             # failed/rate-limited conversations are retried later, then dropped (and logged)
consolidate = true                   # nightly tidy-up (~03:00, or at the next start if missed); log: logs/memory_consolidation.jsonl

[wakeword]
enabled = true                       # tray toggle too; every value here is validated, a bad one falls back to its default
model_path = "models/hey_vex.onnx"   # your trained model (docs/WAKEWORD.md); until it exists the fallback below is used
fallback_model = "hey_jarvis"        # built-in openWakeWord model: say "Hey Jarvis"
threshold = 0.24                     # raise to 0.6-0.7 if it wakes by accident, lower if it misses you (tools_dev/wakeword_tune.py)
cooldown = 2.0                       # seconds between wakes
vad_threshold = 0.5                  # openWakeWord's own speech gate (0 = off)
input_device = ""                    # blank = the [voice] input_device / default microphone
chime = true                         # a soft blip when it wakes

[voice]
enabled = true
input_device = ""                      # blank = Windows default microphone; or part of a device name, e.g. "Intel"
output_device = ""
silence_ms = 700                       # this much quiet after you speak ends the recording (was 1000; lower = faster but cuts slow talkers off)
resume_grace_ms = 500                  # safeguard: keep listening this long after the endpoint, in the background, while speech recognition runs;
resume_min_ms = 120                    # if you talk at least this long in that window the recording is extended and both parts are transcribed together; 0 = off
max_seconds = 20
no_speech_seconds = 6                  # give up if nothing is said for this long
followup_enabled = true                # after a spoken reply keep listening briefly, no wake word needed (tray: Follow-up listening)
followup_s = 8                         # how long that window stays open (0 = off)
followup_min_speech_ms = 250           # voiced audio needed to count as speech in the window (stricter than a normal turn)
followup_delay_ms = 300
wake_greeting = "What can I do for you?"   # spoken after a bare "Hey Vex", then Vex listens for the command ("" = say nothing)
wake_wait_s = 3.0                      # after "Hey Vex", wait this long for the command before greeting                # the window opens this long after Vex's voice has fully stopped (its own echo)
vad_aggressiveness = 2                 # 0-3, higher filters more background noise
stt_model = "whisper-large-v3-turbo"
language = "en"                        # "" = let Whisper detect the language (Hindi, Kannada...)
stt_timeout_seconds = 3.0              # Groq Whisper gets this long per attempt (+ 0.25 s per second of audio), then one retry, then the backup
stt_timeout_per_audio_second = 0.25
stt_retries = 1
stt_fallback = "gemini"                # backup speech recognition if Groq is slow, down or limited ("" = none)
stt_fallback_timeout_seconds = 8.0
edge_warm = true                       # keep one edge-tts connection open: the first sound of a reply comes about 1 s sooner
stt_seconds_per_hour = 7200            # Groq's free Whisper allowance; tracked locally so Vex falls back to typing early
tts_order = ["edge", "windows"]        # edge-tts (free, no key), then the offline Windows voice. Google Chirp is optional: put "google" first (docs/VOICE.md)
edge_candidates = ["en-IN-NeerjaNeural", "en-IN-NeerjaExpressiveNeural", "en-IN-PrabhatNeural", "en-US-AriaNeural", "en-US-AvaNeural",
                   "en-US-AvaMultilingualNeural", "en-US-EmmaNeural", "en-US-JennyNeural", "en-US-MichelleNeural", "en-US-AndrewNeural",
                   "en-US-BrianNeural", "en-US-ChristopherNeural", "en-US-GuyNeural", "en-GB-SoniaNeural", "en-GB-LibbyNeural",
                   "en-GB-RyanNeural"]   # python tools_dev/tts_voices.py speaks one sentence in each; --set <name> saves your pick
# Google Chirp (disabled by default; needs billing): GOOGLE_TTS_API_KEY in .env or google-tts-key.json, and "google" first in tts_order
google_candidates = ["Aoede", "Puck", "Charon", "Kore", "Fenrir", "Leda", "Orus", "Zephyr"]   # python tools_dev/tts_voices.py speaks each one
tts_warn_fractions = [0.75, 0.9]       # tray warnings at these shares of the free allowance
tts_quota_pause_seconds = 3600         # after a quota/billing error, skip Google for this long
windows_voice = ""                     # blank = the Windows default voice
google_voice = "en-US-Chirp3-HD-Aoede"
google_language = "en-US"
edge_voice = "en-US-AriaNeural"
tts_monthly_free_chars = 1000000       # Google's free monthly characters for Chirp 3 HD (check your console)
tts_switch_fraction = 0.9              # switch to edge-tts at this share of the allowance
spoken_max_chars = 280
spoken_sentences = 2                   # longer replies: speak this many sentences; "read the rest" speaks the remainder
confirm_by_voice = true                # yellow confirmations can be answered by voice (red never)
confirm_voice_seconds = 6              # how long after Vex asks that "yes"/"no" is accepted
